<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nay's Portfolio</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div class = "nav-box"></div>
    <div class = "hero-box">
        <img class="hero-bg" src="./images/hero-bg.png">
        <div class="hero-background-box">
            <div class="hero-hill-shape hill-1"></div>
            <div class="hero-hill-shape hill-2"></div>
            <div class="hero-hill-shape hill-3"></div>
        </div>
        <div class="hero-cloud-box">
            <img class= "hero-cloud-img cat-cloud-1" src="./images/cat-cloud-1.PNG" alt="cat shapped cloud">
            <img class= "hero-cloud-img cat-cloud-2" src="./images/cat-cloud-2.PNG" alt="cat shapped cloud">
            <img class= "hero-cloud-img cat-cloud-3" src="./images/cat-cloud-3.PNG" alt="cat shapped cloud">

                <div class="hero-cloud-shape cloud-1 cloud-1-1"></div>

            </div>

                <div class="hero-cloud-shape cloud-2-1"></div>
                <div class="hero-cloud-shape cloud-2-2"></div>
            </div>

            <div class="cloud-3">
                <div class="hero-cloud-shape cloud-3 cloud-3-1"></div>
                <div class="hero-cloud-shape cloud-3 cloud-3-2"></div>
                <div class="hero-cloud-shape cloud-3 cloud-1-3"></div>
            </div>

            <div class="hero-cloud-shape cloud-4"></div>
        </div>
        <h1 class = "hero-title">Nay</h1>
        <img class = "hero-image" src="./images/hero-image.PNG" alt="Penguin lying on a cresent moon">

    <div class = "about-me-box">

    </div>
